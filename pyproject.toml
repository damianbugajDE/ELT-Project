[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-project"
version = "0.1.0"
description = "End-to-end ELT Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faker>=40.23.0",
    "pandas>=2.3.3",
    "prefect>=3.7.5",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "s3fs>=2024.0.0"
]

[tool.ruff]
line-length = 120

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest"
]

[tool.uv]
package = false